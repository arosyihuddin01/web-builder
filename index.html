<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace and Palette</title>
  <style>
    :root { --bg: #0f172a; --panel: #111827; --card: #1f2937; --text: #e5e7eb; --muted: #9ca3af; --accent: #10b981; --danger: #ef4444; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background: var(--bg); color: var(--text); }
    header { padding: 12px 16px; background: #0b1220; border-bottom: 1px solid #253151; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    main { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 54px); }

    .panel { padding: 16px; background: var(--panel); border-right: 1px solid #253151; }
    .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .filters { display: flex; gap: 8px; margin-bottom: 12px; }
    .filters input, .filters select { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #2b3a64; background: #0b1220; color: var(--text); }

    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .card { background: var(--card); border: 1px solid #263045; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 80px 1fr auto; align-items: center; }
    .card .preview { width: 80px; height: 80px; background: #0b1220; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
    .card .meta { padding: 8px 12px; }
    .card h3 { margin: 0 0 4px; font-size: 14px; }
    .card .desc { font-size: 12px; color: var(--muted); }
    .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: 10px; background: #0b1220; color: var(--muted); padding: 3px 6px; border-radius: 999px; border: 1px solid #24314f; }
    .actions { padding: 8px; }
    .btn { padding: 6px 10px; border-radius: 8px; border: 1px solid #224a3f; background: rgba(16,185,129,.1); color: var(--text); cursor: pointer; font-size: 12px; }
    .btn.secondary { border-color: #4b5563; background: transparent; }
    .btn.danger { border-color: #4b2131; background: rgba(239,68,68,.12); }

    .canvas { padding: 16px; }
    .canvas h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .renderer { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 12px; }
    .component { background: var(--card); border: 1px solid #263045; border-radius: 12px; padding: 12px; }
    .component h4 { margin: 0 0 8px; font-size: 13px; }
    .small { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Marketplace</h1>
    <span class="small" id="sync-status">ready</span>
  </header>
  <main>
    <aside class="panel">
      <h2>Marketplace</h2>
      <div class="filters">
        <input id="search" placeholder="Search components..." />
        <select id="tag-filter">
          <option value="">All tags</option>
        </select>
      </div>
      <div class="grid" id="marketplace-grid"></div>
    </aside>
    <section class="canvas">
      <h2>Renderer</h2>
      <div id="renderer" class="renderer"></div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
